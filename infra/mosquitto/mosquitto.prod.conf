# =============================================================================
# SmartVault Agri-WMS — Production Mosquitto Configuration
# =============================================================================
# Used on the deployed server. Certs are placed by scripts/prod-certs/generate.sh
# FQDN: <DUCKDNS_DOMAIN>.duckdns.org
# =============================================================================

# ---------------------------------------------------------------------------
# Plain MQTT — internal Docker network only (bind to loopback / private iface)
# Disable this listener in production if all services use port 8883.
# ---------------------------------------------------------------------------
listener 1883 127.0.0.1
allow_anonymous false
password_file /mosquitto/config/passwd

# ---------------------------------------------------------------------------
# MQTTS — public-facing on port 8883
# Server cert is a publicly trusted Let's Encrypt certificate.
# Clients authenticate with username + password (no client cert required).
# The internal mqtt_bridge service still uses its own client certificate.
# ---------------------------------------------------------------------------
listener 8883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd

# Let's Encrypt cert chain (chain.pem = intermediate CA only)
cafile   /mosquitto/certs/ca.crt
# fullchain.pem = server cert + intermediates (what the client validates)
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key

# Public clients authenticate with username/password, NOT a client cert.
# Set to true only if you want mTLS for every client (IoT devices with certs).
require_certificate false

tls_version tlsv1.2

# ---------------------------------------------------------------------------
# Persistence and logging
# ---------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
