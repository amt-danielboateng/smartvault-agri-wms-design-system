name: Sync Figma Tokens

on:
  push:
    paths:
      - "tokens/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-tokens:
    name: Transform tokens → CSS + Tailwind
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/sync-tokens/package-lock.json

      - name: Install Style Dictionary
        working-directory: scripts/sync-tokens
        run: npm ci

      - name: Run Style Dictionary build
        working-directory: scripts/sync-tokens
        run: npm run build

      - name: Check for generated file changes
        id: diff
        run: |
          git diff --quiet frontend/src/styles/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/token-sync-${{ github.run_number }}
          base: main
          commit-message: "chore(tokens): sync Figma design tokens"
          title: "chore(tokens): sync Figma design tokens"
          body: |
            ## Figma Token Sync

            This PR was auto-generated by the token sync pipeline.

            ### Changed files
            - `frontend/src/styles/tokens.light.css` — light mode CSS variables
            - `frontend/src/styles/tokens.dark.css` — dark mode CSS variables
            - `frontend/src/styles/tailwind-tokens.js` — Tailwind theme extension

            ### Review checklist
            - [ ] Spot-check colors in Storybook / dev server
            - [ ] Verify dark mode toggle renders correctly
            - [ ] Confirm no unintended spacing/radius regressions
          labels: |
            design-tokens
            automated
          add-paths: |
            frontend/src/styles/tokens.light.css
            frontend/src/styles/tokens.dark.css
            frontend/src/styles/tailwind-tokens.js
